syntax = "proto3";

package slipstream.v1;

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0;
  ORDER_STATE_WORKING = 1;
  ORDER_STATE_COMPLETED = 2;
  ORDER_STATE_HALTED = 3;
}

message PriceLevel {
  double price = 1;
  double qty = 2;
}

message BookUpdate {
  string symbol = 1;
  bool is_snapshot = 2;
  repeated PriceLevel bids = 3;
  repeated PriceLevel asks = 4;
  string venue = 5;
  int64 recv_ns = 6;
}

message BookAck {}

message TwapParams {}

message VwapParams {
  repeated double weights = 1;
}

message AlmgrenChrissParams {
  double sigma = 1;
  double eta = 2;
  double risk_aversion = 3;
}

message PovParams {
  double participation = 1;
}

message ParentOrder {
  string order_id = 1;
  Side side = 2;
  double qty = 3;
  int64 start_ns = 4;
  int64 duration_ns = 5;
  int32 num_slices = 6;

  oneof schedule {
    TwapParams twap = 7;
    VwapParams vwap = 8;
    AlmgrenChrissParams almgren_chriss = 9;
    PovParams pov = 10;
  }
}

message SubmitReply {
  bool accepted = 1;
  string reason = 2;
}

message StepRequest {
  int64 now_ns = 1;
}

message Fill {
  string order_id = 1;
  int64 ts_ns = 2;
  double qty = 3;
  double price = 4;
  string venue = 5;
  double fee = 6;
}

message StepReply {
  repeated Fill fills = 1;
  // Orders still working after this step.
  int32 working_orders = 2;
}

message StatusRequest {}

message VenueCost {
  string venue = 1;
  double all_in_bps = 2;
  bool available = 3;
}

message OrderStatus {
  string order_id = 1;
  Side side = 2;
  OrderState state = 3;
  double total_qty = 4;
  double filled_qty = 5;
  double avg_fill_price = 6;
  double arrival_mid = 7;
  double slippage_bps = 8;
  double immediate_cost_bps = 9;
  string halt_reason = 10;
  string algo = 11;
  double fees_paid = 12;
  double fees_bps = 13;
  double routed_all_in_bps = 14;
  repeated VenueCost venue_costs = 15;
  // What the one-shot benchmark route could fill at submit, under the same collar and venue rules.
  double immediate_filled_qty = 16;
}

message VenueInfo {
  string name = 1;
  double fee_bps = 2;
  double min_qty = 3;
  double qty_step = 4;
  double min_notional = 5;
  bool has_book = 6;
  bool fresh = 7;
}

// Top levels of one venue's book, best price first on each side.
message VenueBook {
  string venue = 1;
  repeated PriceLevel bids = 2;
  repeated PriceLevel asks = 3;
}

message EngineStats {
  uint64 events = 1;
  uint64 queue_high_water = 2;
  // Ingest-to-processed time, as the upper bound of a log2 histogram bucket.
  int64 latency_p50_ns = 3;
  int64 latency_p99_ns = 4;
}

enum ClockMode {
  CLOCK_MODE_UNSPECIFIED = 0;
  CLOCK_MODE_LIVE = 1;
  CLOCK_MODE_REPLAY = 2;
}

message StatusReply {
  double position = 1;
  bool has_mid = 2;
  double mid = 3;
  repeated OrderStatus orders = 4;
  repeated VenueInfo venues = 5;
  int32 book_depth = 6;
  repeated VenueBook books = 7;
  EngineStats stats = 8;
  ClockMode clock_mode = 9;
}

message Trade {
  double price = 1;
  double qty = 2;
  int64 ts_ns = 3;
}

message TradeBatch {
  string symbol = 1;
  repeated Trade trades = 2;
  string venue = 3;
}

message TradeAck {}

message Heartbeat {}

// Replay mode only: advances time.
message Tick {
  int64 now_ns = 1;
}

message MarketEvent {
  oneof event {
    BookUpdate book = 1;
    TradeBatch trades = 2;
    Heartbeat heartbeat = 3;
    Tick tick = 4;
  }
}

message MarketStreamSummary {
  uint64 events = 1;
}

message SubscribeRequest {}

message OrderUpdate {
  string order_id = 1;
  OrderState state = 2;
  string reason = 3;
  double filled_qty = 4;
}

message EngineEvent {
  // Strictly increasing across all events.
  uint64 seq = 1;
  oneof event {
    Fill fill = 2;
    OrderUpdate order = 3;
  }
}

service ExecutionEngine {
  rpc ApplyBookUpdate(BookUpdate) returns (BookAck);
  rpc SubmitParentOrder(ParentOrder) returns (SubmitReply);
  rpc Step(StepRequest) returns (StepReply);
  rpc GetStatus(StatusRequest) returns (StatusReply);
  rpc ApplyTrades(TradeBatch) returns (TradeAck);
  // Live mode: one stream per venue, named by the "slipstream-venue" request metadata.
  // Replay mode: exactly one stream, and every book or trade event names its own venue.
  rpc MarketStream(stream MarketEvent) returns (MarketStreamSummary);
  // Fills and order state changes for every order, in engine order. One subscriber at a time.
  rpc Subscribe(SubscribeRequest) returns (stream EngineEvent);
}
