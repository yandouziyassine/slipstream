syntax = "proto3";

package slipstream.v1;

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0;
  ORDER_STATE_WORKING = 1;
  ORDER_STATE_COMPLETED = 2;
  ORDER_STATE_HALTED = 3;
}

message PriceLevel {
  double price = 1;
  double qty = 2;
}

message BookUpdate {
  string symbol = 1;
  bool is_snapshot = 2;
  repeated PriceLevel bids = 3;
  repeated PriceLevel asks = 4;
}

message BookAck {}

message ParentOrder {
  string order_id = 1;
  Side side = 2;
  double qty = 3;
  int64 start_ns = 4;
  int64 duration_ns = 5;
  int32 num_slices = 6;
}

message SubmitReply {
  bool accepted = 1;
  string reason = 2;
}

message StepRequest {
  int64 now_ns = 1;
}

message Fill {
  string order_id = 1;
  int64 ts_ns = 2;
  double qty = 3;
  double price = 4;
}

message StepReply {
  repeated Fill fills = 1;
}

message StatusRequest {}

message OrderStatus {
  string order_id = 1;
  Side side = 2;
  OrderState state = 3;
  double total_qty = 4;
  double filled_qty = 5;
  double avg_fill_price = 6;
  double arrival_mid = 7;
  double slippage_bps = 8;
  double immediate_cost_bps = 9;
  string halt_reason = 10;
}

message StatusReply {
  double position = 1;
  bool has_mid = 2;
  double mid = 3;
  repeated OrderStatus orders = 4;
}

service ExecutionEngine {
  rpc ApplyBookUpdate(BookUpdate) returns (BookAck);
  rpc SubmitParentOrder(ParentOrder) returns (SubmitReply);
  rpc Step(StepRequest) returns (StepReply);
  rpc GetStatus(StatusRequest) returns (StatusReply);
}
