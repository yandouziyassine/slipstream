syntax = "proto3";

package slipstream.v1;

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0;
  ORDER_STATE_WORKING = 1;
  ORDER_STATE_COMPLETED = 2;
  ORDER_STATE_HALTED = 3;
}

message PriceLevel {
  double price = 1;
  double qty = 2;
}

message BookUpdate {
  string symbol = 1;
  bool is_snapshot = 2;
  repeated PriceLevel bids = 3;
  repeated PriceLevel asks = 4;
  string venue = 5;
  int64 recv_ns = 6;
}

message BookAck {}

message TwapParams {}

message VwapParams {
  repeated double weights = 1;
}

message AlmgrenChrissParams {
  double sigma = 1;
  double eta = 2;
  double risk_aversion = 3;
}

message PovParams {
  double participation = 1;
}

message ParentOrder {
  string order_id = 1;
  Side side = 2;
  double qty = 3;
  int64 start_ns = 4;
  int64 duration_ns = 5;
  int32 num_slices = 6;

  oneof schedule {
    TwapParams twap = 7;
    VwapParams vwap = 8;
    AlmgrenChrissParams almgren_chriss = 9;
    PovParams pov = 10;
  }
}

message SubmitReply {
  bool accepted = 1;
  string reason = 2;
}

message StepRequest {
  int64 now_ns = 1;
}

message Fill {
  string order_id = 1;
  int64 ts_ns = 2;
  double qty = 3;
  double price = 4;
  string venue = 5;
  double fee = 6;
}

message StepReply {
  repeated Fill fills = 1;
}

message StatusRequest {}

message VenueCost {
  string venue = 1;
  double all_in_bps = 2;
  bool available = 3;
}

message OrderStatus {
  string order_id = 1;
  Side side = 2;
  OrderState state = 3;
  double total_qty = 4;
  double filled_qty = 5;
  double avg_fill_price = 6;
  double arrival_mid = 7;
  double slippage_bps = 8;
  double immediate_cost_bps = 9;
  string halt_reason = 10;
  string algo = 11;
  double fees_paid = 12;
  double fees_bps = 13;
  double routed_all_in_bps = 14;
  repeated VenueCost venue_costs = 15;
}

message StatusReply {
  double position = 1;
  bool has_mid = 2;
  double mid = 3;
  repeated OrderStatus orders = 4;
}

message Trade {
  double price = 1;
  double qty = 2;
  int64 ts_ns = 3;
}

message TradeBatch {
  string symbol = 1;
  repeated Trade trades = 2;
  string venue = 3;
}

message TradeAck {}

service ExecutionEngine {
  rpc ApplyBookUpdate(BookUpdate) returns (BookAck);
  rpc SubmitParentOrder(ParentOrder) returns (SubmitReply);
  rpc Step(StepRequest) returns (StepReply);
  rpc GetStatus(StatusRequest) returns (StatusReply);
  rpc ApplyTrades(TradeBatch) returns (TradeAck);
}
