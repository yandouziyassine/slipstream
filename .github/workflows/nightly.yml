name: nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc \
            libgtest-dev python3-venv
      - name: Install Python dependencies (hash-verified)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r python/requirements-dev.txt
      - name: Run nightly flake hunt
        # Without an explicit shell a run step is `bash -e`, with no pipefail: tee's exit status
        # would hide a failing nightly.sh.
        run: |
          set -o pipefail
          PATH="$PWD/.venv/bin:$PATH" bash scripts/nightly.sh 2>&1 | tee nightly-output.log
      - name: Upload nightly output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-output
          path: nightly-output.log
          retention-days: 14
