name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc \
            libgtest-dev python3-venv
      - name: Install Python dependencies (hash-verified)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r python/requirements-dev.txt
      - name: Build, lint, test, audit
        run: PATH="$PWD/.venv/bin:$PATH" bash scripts/ci.sh
