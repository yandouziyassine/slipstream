[project]
name = "slipstream"
version = "0.1.0"
description = "Paper-trading smart order execution: Python orchestrator for the Slipstream C++ engine"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["slipstream/v1"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^slipstream/v1/"]

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["slipstream.v1.execution_pb2"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["slipstream.v1.execution_pb2_grpc"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
